# The one CI workflow (docs/spec/README.md, "CI"). Every pull request gets a result from the
# `gate` job, the check `main` requires; the heavy jobs run only when on-chain code changed,
# and the gate fails unless each job that ran passed.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      onchain: ${{ steps.paths.outputs.onchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did on-chain code change?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          # The programs, everything that builds, tests or runs them, and this workflow.
          ONCHAIN_PATHS: >-
            ^programs/|^fixtures/pins\.env$|^\.github/workflows/ci\.yml$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$|^scripts/(build-programs|fetch-router|test-fetch-router|fetch-pipeline|install-toolchain|toolchain-env|local-validator)\.sh$|^scripts/workspace-programs\.py$
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$GITHUB_SHA" ;;
            *) range="" ;;
          esac
          if [ -z "$range" ] || ! changed="$(git diff --name-only "$range" 2>/dev/null)"; then
            echo "No diff to compare against; running everything."
            echo "onchain=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -Eq "$ONCHAIN_PATHS"; then
            echo "onchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "No on-chain code changed; the heavy jobs are skipped."
            echo "onchain=false" >> "$GITHUB_OUTPUT"
          fi

  no-keypairs:
    name: no keypairs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The check refuses keypairs
        run: scripts/test-check-no-keypairs.sh
      - name: No keypair in the repository
        run: scripts/check-no-keypairs.sh

  rust:
    name: rust (fmt, SBF build, clippy, tests)
    needs: changes
    if: needs.changes.outputs.onchain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Test binaries link every Solana crate; without debug info they are a fraction of the
      # size, which keeps the runner's disk from filling up.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Cache the Solana toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/testing-pipeline/toolchain/cargo-build-sbf-*
            ~/.local/share/testing-pipeline/toolchain/agave-*
            ~/.cache/solana
          key: ${{ runner.os }}-solana-${{ hashFiles('scripts/install-toolchain.sh', 'scripts/toolchain-env.sh') }}
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('programs/Cargo.lock', 'programs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install the toolchain
        run: scripts/install-toolchain.sh solana
      - name: The router fixture script refuses a dump that differs from its pin
        run: scripts/test-fetch-router.sh
      - name: Fetch devnet's router, checked against its pinned hash
        run: source scripts/toolchain-env.sh && scripts/fetch-router.sh
      - name: Formatting
        run: cd programs && cargo fmt --all -- --check
      - name: Build each program by its own manifest
        run: source scripts/toolchain-env.sh && scripts/build-programs.sh
      - name: Clippy
        run: cd programs && cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (LiteSVM through devnet's router, with pipeline-check)
        run: cd programs && cargo test --workspace

  typescript:
    name: typescript
    needs: changes
    if: needs.changes.outputs.onchain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Pipeline's TypeScript SDK, built from the pinned commit (it is not on npm)
        run: scripts/fetch-pipeline.sh sdk
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck

  kani:
    name: kani
    needs: changes
    if: needs.changes.outputs.onchain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/testing-pipeline/toolchain/kani-*
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: ${{ runner.os }}-kani-${{ hashFiles('scripts/install-toolchain.sh', 'scripts/toolchain-env.sh') }}
      - name: Cache Z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/testing-pipeline/z3
          key: ${{ runner.os }}-z3-solver-5.4.1.0
      - name: Z3 proofs (every program's proofs/*_z3.py, for the maths Kani cannot finish)
        run: |
          shopt -s nullglob
          venv="$HOME/.cache/testing-pipeline/z3"
          if ! "$venv/bin/python" -c 'import z3' 2>/dev/null; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet z3-solver==5.4.1.0
          fi
          for proof in programs/*/proofs/*_z3.py; do
            echo "== $proof"
            "$venv/bin/python" "$proof"
          done
      - name: Install Kani
        run: scripts/install-toolchain.sh kani
      - name: Kani proofs (the default tiers; harnesses in parallel)
        run: source scripts/toolchain-env.sh && cd programs && cargo kani --workspace -j --output-format=terse

  gate:
    name: gate
    if: always()
    needs: [changes, no-keypairs, rust, typescript, kani]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job that had to run passed
        env:
          ONCHAIN: ${{ needs.changes.outputs.onchain }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' | {
            ok=true
            while IFS== read -r job result; do
              case "$job" in
                changes | no-keypairs) expected=success ;;
                *) if [ "$ONCHAIN" = true ]; then expected=success; else expected=skipped; fi ;;
              esac
              echo "$job: $result (expected $expected)"
              [ "$result" = "$expected" ] || ok=false
            done
            $ok
          }
