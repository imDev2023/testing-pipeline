# The one CI workflow (docs/spec/README.md, "CI"). Every pull request gets a result from the
# `gate` job, the check `main` requires; the heavy jobs run only when on-chain code changed,
# the `canary` job only when Canary's binary or what it builds on changed, and the gate
# fails unless each job that ran passed.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Where the jobs run: GitHub's ubuntu-24.04 runners unless the repository variable CI_RUNS_ON
# names others, as a JSON label list (docs/toolchain.md, "CI on the owner's iMac"). Runners
# that keep their own toolchains skip the cache steps, which only GitHub's runners need.
jobs:
  changes:
    name: changes
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    outputs:
      onchain: ${{ steps.paths.outputs.onchain }}
      canary: ${{ steps.paths.outputs.canary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did on-chain code or Canary change?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          # The programs, everything that builds, tests or runs them (the TypeScript packages and
          # apps too), and this workflow.
          ONCHAIN_PATHS: >-
            ^programs/|^packages/|^apps/|^fixtures/pins\.env$|^\.github/workflows/ci\.yml$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$|^scripts/(build-programs|fetch-router|test-fetch-router|fetch-pipeline|install-toolchain|toolchain-env|local-validator|deploy-devnet|test-deploy-devnet)\.sh$|^scripts/workspace-programs\.py$
          # Canary's crates, the fixtures its tests load (the router's pin, and Pipeline's test
          # programs at the rev programs/Cargo.toml pins), the scripts that fetch them, and this
          # workflow.
          CANARY_PATHS: >-
            ^crates/|^fixtures/pins\.env$|^programs/Cargo\.toml$|^\.github/workflows/ci\.yml$|^scripts/(fetch-router|fetch-pipeline|install-toolchain|toolchain-env)\.sh$
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$GITHUB_SHA" ;;
            *) range="" ;;
          esac
          if [ -z "$range" ] || ! changed="$(git diff --name-only "$range" 2>/dev/null)"; then
            echo "No diff to compare against; running everything."
            echo "onchain=true" >> "$GITHUB_OUTPUT"
            echo "canary=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -Eq "$ONCHAIN_PATHS"; then
            echo "onchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "No on-chain code changed; the heavy jobs are skipped."
            echo "onchain=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq "$CANARY_PATHS"; then
            echo "canary=true" >> "$GITHUB_OUTPUT"
          else
            echo "Canary did not change; its job is skipped."
            echo "canary=false" >> "$GITHUB_OUTPUT"
          fi

  no-keypairs:
    name: no keypairs
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The check refuses keypairs
        run: scripts/test-check-no-keypairs.sh
      - name: No keypair in the repository
        run: scripts/check-no-keypairs.sh

  rust:
    name: rust (fmt, SBF build, clippy, tests)
    needs: changes
    if: needs.changes.outputs.onchain == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    # 13 minutes on an idle runner, but 57 on 2026-11-17 while other projects loaded the iMac
    # that hosts the runners (load average above 50), so the limit leaves room for that.
    timeout-minutes: 90
    env:
      # Test binaries link every Solana crate; without debug info they are a fraction of the
      # size, which keeps the runner's disk from filling up.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Cache the Solana toolchain
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/testing-pipeline/toolchain/cargo-build-sbf-*
            ~/.local/share/testing-pipeline/toolchain/agave-*
            ~/.cache/solana
          key: ${{ runner.os }}-solana-${{ hashFiles('scripts/install-toolchain.sh', 'scripts/toolchain-env.sh') }}
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('programs/Cargo.lock', 'programs/Cargo.toml', 'programs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install the toolchain
        run: scripts/install-toolchain.sh solana
      - name: The router fixture script refuses a dump that differs from its pin
        run: scripts/test-fetch-router.sh
      - name: The devnet deploy script refuses what it must, and records what it deployed
        run: scripts/test-deploy-devnet.sh
      - name: Fetch devnet's router, checked against its pinned hash
        run: source scripts/toolchain-env.sh && scripts/fetch-router.sh
      - name: The Kamino fixture scripts refuse klend bytes that differ from their pins, and a changed account layout
        run: bash programs/lending-amm/scripts/test-fixture-scripts.sh
      - name: Fetch klend from mainnet and devnet, checked against their pinned hashes
        run: source scripts/toolchain-env.sh && bash programs/lending-amm/scripts/fetch-klend.sh
      - name: Cache Pipeline's clone and test programs
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/pipeline
          key: ${{ runner.os }}-pipeline-${{ hashFiles('programs/Cargo.toml', 'scripts/fetch-pipeline.sh') }}
      - name: Build Pipeline's test programs, for hostile tests (a second strategy, test hooks)
        run: source scripts/toolchain-env.sh && scripts/fetch-pipeline.sh programs
      - name: Formatting
        run: cd programs && cargo fmt --all -- --check
      - name: Build each program by its own manifest
        run: source scripts/toolchain-env.sh && scripts/build-programs.sh
      - name: The buy wall AMM release gate's test builds, which would strand a market (POOL4-44)
        run: source scripts/toolchain-env.sh && cd programs && cargo run -p buy-wall-gate -- test-builds
      - name: The lending AMM's deliberately broken builds, which its invariant fuzzer must catch
        run: source scripts/toolchain-env.sh && python3 programs/lending-amm/scripts/broken-builds.py
      - name: Clippy
        run: cd programs && cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (LiteSVM through devnet's router, with pipeline-check)
        run: cd programs && cargo test --workspace
      - name: The lending AMM's mainnet build (its default is devnet), tested on the cloned mainnet reserves
        run: |
          source scripts/toolchain-env.sh
          cargo build-sbf --manifest-path programs/lending-amm/Cargo.toml --no-default-features --features mainnet --sbf-out-dir programs/target/deploy-mainnet
          cd programs
          cargo clippy -p lending-amm --no-default-features --features mainnet --all-targets -- -D warnings
          SBF_OUT_DIR="$PWD/target/deploy-mainnet" cargo test -p lending-amm --no-default-features --features mainnet
      - name: The buy wall AMM with DESIGNER_RECIPIENT set to a test key, so the designer slot's payout is tested (POOL4-39)
        run: |
          source scripts/toolchain-env.sh
          cargo build-sbf --manifest-path programs/buy-wall-amm/Cargo.toml --features test-designer-recipient --sbf-out-dir programs/target/deploy-designer
          cd programs
          cargo clippy -p buy-wall-amm --features test-designer-recipient --all-targets -- -D warnings
          SBF_OUT_DIR="$PWD/target/deploy-designer" cargo test -p buy-wall-amm --features test-designer-recipient --lib --test payouts

  typescript:
    name: typescript
    needs: changes
    if: needs.changes.outputs.onchain == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Pipeline's TypeScript SDK, built from the pinned commit (it is not on npm)
        run: scripts/fetch-pipeline.sh sdk
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: The packages' and apps' tests (strategy-actions, keeper-jobs, the keeper's settings)
        run: pnpm --recursive --if-present test

  kani:
    name: kani
    needs: changes
    if: needs.changes.outputs.onchain == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    # 54 minutes on 2026-11-17 with the lending AMM's 42 harnesses while the runners' host was
    # loaded (21 on an idler one), so the limit leaves room for that.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Kani
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/testing-pipeline/toolchain/kani-*
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: ${{ runner.os }}-kani-${{ hashFiles('scripts/install-toolchain.sh', 'scripts/toolchain-env.sh') }}
      - name: Cache Z3
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/testing-pipeline/z3
          key: ${{ runner.os }}-z3-solver-5.4.1.0
      - name: Z3 proofs (every program's proofs/*_z3.py, for the maths Kani cannot finish)
        run: |
          shopt -s nullglob
          venv="$HOME/.cache/testing-pipeline/z3"
          if ! "$venv/bin/python" -c 'import z3' 2>/dev/null; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet z3-solver==5.4.1.0
          fi
          for proof in programs/*/proofs/*_z3.py; do
            echo "== $proof"
            "$venv/bin/python" "$proof"
          done
      - name: Install Kani
        run: scripts/install-toolchain.sh kani
      - name: Kani proofs (the default tiers; harnesses in parallel)
        run: source scripts/toolchain-env.sh && cd programs && cargo kani --workspace -j --output-format=terse

  canary:
    name: canary (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.canary == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the Solana toolchain
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/testing-pipeline/toolchain/cargo-build-sbf-*
            ~/.local/share/testing-pipeline/toolchain/agave-*
            ~/.cache/solana
          key: ${{ runner.os }}-solana-${{ hashFiles('scripts/install-toolchain.sh', 'scripts/toolchain-env.sh') }}
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-canary-cargo-${{ hashFiles('crates/Cargo.lock', 'crates/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-canary-cargo-
      - name: Install the toolchain (the Solana CLI fetches the router; cargo-build-sbf builds Pipeline's test programs)
        run: scripts/install-toolchain.sh solana
      - name: Fetch devnet's router, checked against its pinned hash
        run: source scripts/toolchain-env.sh && scripts/fetch-router.sh
      - name: Build Pipeline's test programs (test-strategy-cp and test-strategy-evil)
        run: source scripts/toolchain-env.sh && scripts/fetch-pipeline.sh programs
      - name: Build Canary's own fixture programs (crates/canary/tests/fixtures)
        run: source scripts/toolchain-env.sh && crates/canary/tests/fixtures/build.sh
      - name: Formatting
        run: cd crates && cargo fmt --all -- --check
      - name: Clippy
        run: cd crates && cargo clippy --all-targets -- -D warnings
      - name: Tests (LiteSVM through devnet's router)
        run: cd crates && cargo test

  gate:
    name: gate
    if: always()
    needs: [changes, no-keypairs, rust, typescript, kani, canary]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - name: Every job that had to run passed
        env:
          ONCHAIN: ${{ needs.changes.outputs.onchain }}
          CANARY: ${{ needs.changes.outputs.canary }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' | {
            ok=true
            while IFS='=' read -r job result; do
              case "$job" in
                changes | no-keypairs) expected=success ;;
                canary) if [ "$CANARY" = true ]; then expected=success; else expected=skipped; fi ;;
                *) if [ "$ONCHAIN" = true ]; then expected=success; else expected=skipped; fi ;;
              esac
              echo "$job: $result (expected $expected)"
              [ "$result" = "$expected" ] || ok=false
            done
            $ok
          }
