<style>
/* Layout: a mock of Pipescope's strategy page. The explanation column sits beside the facts rail that code builds;
   a floating pill switches the presentation variant, tabs switch the sample. Canary yellow marks Canary results. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunk: #eaeef3; --fg: #141920; --muted: #586373; --line: #d6dce4;
  --accent: #1d5bb8; --canary: #7a5900; --canary-bg: #fff3c4; --ok: #17703f; --ok-bg: #e2f3e9;
  --bad: #ad2216; --bad-bg: #fce7e4; --author: #6b3fa0; --author-bg: #f1eafa; --hi: #ffe98a;
  --pill-bg: #141920; --pill-fg: #f3f5f8;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --step--1: 0.8125rem; --step-0: 0.9375rem; --step-1: 1.0625rem; --step-2: 1.375rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #151a21; --sunk: #1b222b; --fg: #e5e9ef; --muted: #98a3b3; --line: #29313c;
    --accent: #7fb0ff; --canary: #f0c94a; --canary-bg: #33290a; --ok: #63d394; --ok-bg: #102a1b;
    --bad: #ff8c80; --bad-bg: #36130f; --author: #c9a6f5; --author-bg: #261a36; --hi: #4d3f0c;
    --pill-bg: #e5e9ef; --pill-fg: #0d1015; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #151a21; --sunk: #1b222b; --fg: #e5e9ef; --muted: #98a3b3; --line: #29313c;
  --accent: #7fb0ff; --canary: #f0c94a; --canary-bg: #33290a; --ok: #63d394; --ok-bg: #102a1b;
  --bad: #ff8c80; --bad-bg: #36130f; --author: #c9a6f5; --author-bg: #261a36; --hi: #4d3f0c;
  --pill-bg: #e5e9ef; --pill-fg: #0d1015; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: var(--step-0); line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 0; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.brand b { font-family: var(--mono); font-weight: 500; letter-spacing: 0.02em; }
.brand span { color: var(--muted); font-size: var(--step--1); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-size: var(--step--1); background: none; border: 0; color: var(--muted); padding: 8px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 500; }
.tabs button:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main .wrap { display: flex; flex-direction: column; gap: 20px; padding-block: 22px 96px; }
.head { display: flex; flex-direction: column; gap: 4px; }
.head h1 { font-size: var(--step-2); font-weight: 600; margin: 0; text-wrap: balance; }
.head .sub { color: var(--muted); font-size: var(--step--1); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 20px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.explainer { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.ai-label { font-size: var(--step--1); color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; max-width: 68ch; }
.ai-label strong { color: var(--fg); font-weight: 500; }
.notice { font-size: var(--step--1); background: var(--author-bg); color: var(--fg); border-radius: 4px; padding: 8px 10px; }
.notice b { color: var(--author); font-weight: 600; }
.lede { font-size: var(--step-1); line-height: 1.6; max-width: 66ch; margin: 0; }
.tail { white-space: nowrap; }
.cite { display: inline-flex; gap: 2px; vertical-align: 2px; margin-left: 2px; }
.chip { font-family: var(--mono); font-size: 0.66rem; line-height: 1; padding: 3px 4px; border-radius: 3px; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); cursor: pointer; }
.chip[data-k="C"] { background: var(--canary-bg); color: var(--canary); border-color: transparent; }
.chip[data-k="A"] { background: var(--author-bg); color: var(--author); border-color: transparent; }
.chip.missing { background: var(--bad-bg); color: var(--bad); border-color: transparent; text-decoration: line-through; }
h2.sec { font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; margin: 4px 0 0; }
ul.claims { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 68ch; }
ul.claims li { padding-left: 14px; position: relative; }
ul.claims li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
ul.claims li.inferred::before { background: transparent; border: 1px solid var(--muted); }
ul.claims li.author::before { background: var(--author); }
.unknowns { background: var(--sunk); border-radius: 4px; padding: 10px 12px; font-size: var(--step--1); display: flex; flex-direction: column; gap: 4px; }
.unknowns b { font-weight: 600; }
details.more > summary { cursor: pointer; color: var(--accent); font-size: var(--step--1); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { margin-bottom: 12px; }
.ledger-wrap { overflow-x: auto; }
table.ledger { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
table.ledger th { text-align: left; font-weight: 600; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.ledger td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ledger td.st { width: 46%; min-width: 15em; }
table.ledger td.n { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; width: 2.2em; }
table.ledger .ev { display: flex; flex-direction: column; gap: 6px; min-width: 14em; font-size: 0.78rem; line-height: 1.45; }
table.ledger .ev span { color: var(--muted); }
.basis { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; white-space: nowrap; font-weight: 500; }
.basis.confirmed { background: var(--ok-bg); color: var(--ok); }
.basis.inferred { background: var(--sunk); color: var(--muted); border: 1px dashed var(--muted); }
.basis.author { background: var(--author-bg); color: var(--author); }
.feedback { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--step--1); color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.feedback button { font: inherit; font-size: var(--step--1); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.fallback { background: var(--sunk); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 6px; max-width: 66ch; }
.fallback b { font-weight: 600; }
.facts { padding: 14px 0 6px; }
.facts h2 { font-size: var(--step-0); margin: 0 16px 2px; font-weight: 600; }
.facts .why { margin: 0 16px 10px; color: var(--muted); font-size: var(--step--1); }
.group { border-top: 1px solid var(--line); padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 6px; }
.group h3 { margin: 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 0.7rem; padding: 1px 6px; border-radius: 10px; }
.tag.canary { background: var(--canary-bg); color: var(--canary); }
.tag.author { background: var(--author-bg); color: var(--author); }
.fact { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 8px; font-size: var(--step--1); padding: 4px 6px; margin: 0 -6px; border-radius: 4px; transition: background 0.2s; }
.fact .id { font-family: var(--mono); color: var(--muted); font-size: 0.72rem; padding-top: 2px; }
.fact .lab { color: var(--muted); overflow-wrap: anywhere; }
.fact .lab .addr { font-family: var(--mono); font-size: 0.74rem; }
.fact .val { overflow-wrap: anywhere; }
.fact .val .addr { font-family: var(--mono); font-size: 0.78rem; }
.fact .src { color: var(--muted); font-size: 0.72rem; overflow-wrap: anywhere; }
.fact.hit { background: var(--hi); }
.fact.cited-none .id { opacity: 0.55; }
.checks { padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; border-style: dashed; }
.checks h2 { margin: 0; font-size: var(--step-0); font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.checks p { margin: 0; color: var(--muted); font-size: var(--step--1); max-width: 80ch; }
.verdict { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.verdict.pass { background: var(--ok-bg); color: var(--ok); }
.verdict.fail { background: var(--bad-bg); color: var(--bad); }
.checks ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 18px; font-size: var(--step--1); }
.checks li { display: grid; grid-template-columns: 1.2em minmax(0, 1fr); gap: 4px; }
.checks li .m { font-weight: 600; }
.checks li.ok .m { color: var(--ok); }
.checks li.no .m { color: var(--bad); }
.checks li .err { grid-column: 2; color: var(--bad); font-size: 0.78rem; }
.drafts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--step--1); color: var(--muted); }
.drafts button { font: inherit; font-size: var(--step--1); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 4px 10px; border-radius: 4px; cursor: pointer; }
.drafts button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
details.io { padding: 12px 18px; }
details.io summary { cursor: pointer; font-weight: 500; }
details.io p { color: var(--muted); font-size: var(--step--1); max-width: 80ch; }
details.io pre { font-family: var(--mono); font-size: 0.75rem; background: var(--sunk); padding: 12px; border-radius: 4px; overflow-x: auto; max-height: 420px; }
.about { font-size: var(--step--1); color: var(--muted); max-width: 90ch; display: flex; flex-direction: column; gap: 6px; }
.about p { margin: 0; }
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 2px; background: var(--pill-bg); color: var(--pill-fg); border-radius: 999px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); z-index: 20; font-size: var(--step--1); max-width: calc(100vw - 32px); }
.switcher button { font: inherit; background: none; color: inherit; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.switcher button:hover { background: rgba(127,127,127,0.25); }
.switcher .label { padding: 0 8px; white-space: nowrap; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .fact { transition: none; } }
</style>

<script>
// PROTOTYPE logic for the explainer samples: the output validator production would run, plus helpers.
// Kept free of DOM code so `node check.mjs` can run the same checks the page shows.

const BANNED = [
  'safe', 'safely', 'safer', 'safest', 'safety', 'unsafe', 'secure', 'secured', 'security',
  'audit', 'audits', 'audited', 'auditor', 'auditors', 'trustworthy', 'trusted',
  'legit', 'legitimate', 'scam', 'scams', 'scammer', 'rug', 'rugs', 'rugged', 'rugpull', 'rug-pull',
  'honeypot', 'honeypots', 'risk-free', 'riskless', 'guarantee', 'guarantees', 'guaranteed',
  'recommend', 'recommends', 'recommended', 'recommendation', 'certified', 'vetted', 'approved'
];
const BANNED_PHRASES = [
  /\bshould (?:you )?(?:buy|sell|hold)\b/i, /\b(?:buy|sell|hold) (?:now|today)\b/i,
  /\bprice (?:will|could|should|may) (?:rise|fall|go|moon|pump|dump)\b/i, /\bexpected (?:return|profit|yield)\b/i,
  /\bnothing (?:can|will) go wrong\b/i, /\byou can always\b/i
];
const B58 = '[1-9A-HJ-NP-Za-km-z]';
const SHORT_ADDR = new RegExp(`\\b${B58}{4}\\.\\.\\.${B58}{4}\\b`, 'g');
const FULL_ADDR = new RegExp(`\\b${B58}{32,44}\\b`, 'g');
const INJECTION_HINTS = [
  /ignore (?:all |any )?(?:previous|prior|above|earlier) (?:instructions|rules)/i, /\byou are (?:an? )?(?:ai|assistant|language model|llm)\b/i,
  /\b(?:ai|llm|assistant|language model)s?\b.*\b(?:must|should|say|state|describe|tell)\b/i, /\bsystem prompt\b/i,
  /\bdisregard\b/i, /\bnew instructions\b/i
];
const LIMITS = { summarySentences: [2, 3], summaryWords: 70, claims: 14, claimWords: 45, unknowns: 6, unknownWords: 35 };

function words(s) { return s.trim().split(/\s+/).filter(Boolean).length; }
function norm(s) { return String(s).replace(/(\d),(?=\d{3}\b)/g, '$1'); }

// Pull every number-like token out of a claim: dates, times, then plain numbers; addresses are removed first.
function tokens(text) {
  let t = norm(text);
  const addrs = [...(t.match(SHORT_ADDR) || []), ...(t.match(FULL_ADDR) || [])];
  t = t.replace(SHORT_ADDR, ' ').replace(FULL_ADDR, ' ');
  const dates = t.match(/\b\d{4}-\d{2}-\d{2}\b/g) || [];
  t = t.replace(/\b\d{4}-\d{2}-\d{2}\b/g, ' ');
  const times = t.match(/\b\d{1,2}:\d{2}\b/g) || [];
  t = t.replace(/\b\d{1,2}:\d{2}\b/g, ' ');
  const nums = (t.match(/\d+(?:\.\d+)?/g) || []);
  return { addrs, dates, times, nums };
}

function evidenceText(ev) { return norm(`${ev.label} ${ev.value} ${ev.source || ''}`); }

function numberIn(num, hay) {
  const re = new RegExp(`(?<![\\d.])${num.replace('.', '\\.')}(?![\\d]|\\.\\d)`);
  return re.test(hay);
}

function addressIn(addr, hay) {
  if (addr.includes('...')) {
    const [a, b] = addr.split('...');
    const full = hay.match(FULL_ADDR) || [];
    return full.some(f => f.startsWith(a) && f.endsWith(b)) || hay.includes(addr);
  }
  return hay.includes(addr);
}

function detectInjection(author) {
  return author.some(a => INJECTION_HINTS.some(re => re.test(a.value)));
}

// Normalise author text the way production would before the model sees it.
function sanitizeAuthor(value, cap) {
  const stripped = String(value)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
    .replace(/[​-‏‪-‮⁠-⁩﻿]/g, '');
  return stripped.length > cap ? stripped.slice(0, cap) + ' [cut at ' + cap + ' characters]' : stripped;
}

function validate(sample, out) {
  const all = new Map(sample.evidence.map(e => [e.id, e]));
  const problems = { cites: [], ids: [], numbers: [], format: [], banned: [], author: [], length: [], shape: [] };
  const items = [
    ...out.summary.map((s, i) => ({ where: `summary ${i + 1}`, kind: 'summary', ...s })),
    ...out.claims.map((c, i) => ({ where: `claim ${i + 1}`, kind: 'claim', ...c })),
    ...out.unknowns.map((u, i) => ({ where: `unknown ${i + 1}`, kind: 'unknown', ...u }))
  ];
  for (const it of items) {
    const ev = it.evidence || [];
    if (it.kind !== 'unknown' && ev.length === 0) problems.cites.push(`${it.where} cites no evidence`);
    for (const id of ev) if (!all.has(id)) problems.ids.push(`${it.where} cites ${id}, which is not in the input`);
    const hay = ev.filter(id => all.has(id)).map(id => evidenceText(all.get(id))).join(' \n ');
    const { addrs, dates, times, nums } = tokens(it.text);
    for (const a of addrs) if (!addressIn(a, hay)) problems.numbers.push(`${it.where}: address ${a} is not in its cited evidence`);
    for (const d of dates) if (!hay.includes(d)) problems.numbers.push(`${it.where}: date ${d} is not in its cited evidence`);
    for (const t of times) if (!hay.includes(t)) problems.numbers.push(`${it.where}: time ${t} is not in its cited evidence`);
    for (const n of nums) if (!numberIn(n, hay)) problems.numbers.push(`${it.where}: number ${n} is not in its cited evidence`);
    if (/https?:\/\/|www\.|javascript:|data:|\b[a-z0-9-]+\.(?:com|io|xyz|fun|app|net|org|dev)\b/i.test(it.text)) problems.format.push(`${it.where} contains a link or domain`);
    if (/[<>`]|\*\*|__|\]\(|^\s*(?:#|[-+*]\s)/m.test(it.text)) problems.format.push(`${it.where} contains Markdown or HTML characters`);
    if (/\b[PFCSA]\d{1,2}\b/.test(it.text)) problems.format.push(`${it.where} writes an evidence id into its text`);
    for (const w of BANNED) if (new RegExp(`\\b${w}\\b`, 'i').test(it.text)) problems.banned.push(`${it.where} uses the banned term "${w}"`);
    for (const re of BANNED_PHRASES) if (re.test(it.text)) problems.banned.push(`${it.where} gives advice or a prediction ("${it.text.match(re)[0]}")`);
    const citesAuthor = ev.some(id => id.startsWith('A'));
    if (it.kind === 'claim' && it.basis === 'author') {
      if (!citesAuthor) problems.author.push(`${it.where} is marked author but cites no author text`);
      if (!/\bauthor\b/i.test(it.text)) problems.author.push(`${it.where} does not say the text is the author's`);
    } else if (citesAuthor && !/\bauthor\b/i.test(it.text)) {
      problems.author.push(`${it.where} rests on author text without attributing it`);
    }
    if (it.kind === 'claim' && it.basis === 'inferred' && !/\bappears? to\b/i.test(it.text)) problems.author.push(`${it.where} is inferred but does not say "appears to"`);
    const cap = it.kind === 'claim' ? LIMITS.claimWords : it.kind === 'unknown' ? LIMITS.unknownWords : 40;
    if (words(it.text) > cap) problems.length.push(`${it.where} has ${words(it.text)} words (limit ${cap})`);
  }
  const [lo, hi] = LIMITS.summarySentences;
  if (out.summary.length < lo || out.summary.length > hi) problems.length.push(`summary has ${out.summary.length} sentences (${lo} to ${hi})`);
  const sw = out.summary.reduce((n, s) => n + words(s.text), 0);
  if (sw > LIMITS.summaryWords) problems.length.push(`summary has ${sw} words (limit ${LIMITS.summaryWords})`);
  if (out.claims.length > LIMITS.claims) problems.length.push(`${out.claims.length} claims (limit ${LIMITS.claims})`);
  if (out.unknowns.length > LIMITS.unknowns) problems.length.push(`${out.unknowns.length} unknowns (limit ${LIMITS.unknowns})`);
  const topics = new Set(['does', 'control', 'canary', 'protection', 'author']);
  const bases = new Set(['confirmed', 'inferred', 'author']);
  out.claims.forEach((c, i) => {
    if (!topics.has(c.topic)) problems.shape.push(`claim ${i + 1} has unknown topic ${c.topic}`);
    if (!bases.has(c.basis)) problems.shape.push(`claim ${i + 1} has unknown basis ${c.basis}`);
  });
  const codeFlag = detectInjection(sample.evidence.filter(e => e.id.startsWith('A')));
  const checks = [
    ['Every sentence cites evidence', problems.cites],
    ['Every cited id exists in the input', problems.ids],
    ['Numbers, dates and addresses appear in the cited evidence', problems.numbers],
    ['Plain text: no links, Markdown, HTML or evidence ids', problems.format],
    ['No verdicts, advice or predictions', problems.banned],
    ['Author text only in attributed claims; inferred claims say "appears to"', problems.author],
    ['Within length limits', problems.length],
    ['Matches the schema', problems.shape]
  ].map(([name, errs]) => ({ name, ok: errs.length === 0, errors: errs }));
  return {
    pass: checks.every(c => c.ok),
    checks,
    injection: { model: !!out.author_text_addresses_ai, code: codeFlag, shown: !!out.author_text_addresses_ai || codeFlag }
  };
}

</script>
<script>
// PROTOTYPE data: the evidence Pipescope would build for each strategy version, and the model output

    el('p', { class: 'lede' }, out.summary.map(x => [sentence(x, s), ' '])),
    unknownBox(out, s, 'What the evidence does not settle'),
    el('details', { class: 'more' }, el('summary', { text: `Read the full explanation (${out.claims.length} points)` }), ...claimsByTopic(out, s))
  ];
}
function variantB(out, s) {
  return [...claimsByTopic(out, s), unknownBox(out, s, 'What the evidence does not settle')];
}
function variantC(out, s) {
  const ev = new Map(evidenceOf(s).map(e => [e.id, e]));
  const basisName = { confirmed: 'Confirmed', inferred: 'Inferred', author: 'Author says' };
  const row = (n, text, basis, ids) => el('tr', {},
    el('td', { class: 'n', text: n }),
    el('td', { class: 'st', text }),
    el('td', {}, basis ? el('span', { class: 'basis ' + basis, text: basisName[basis] }) : el('span', { class: 'basis inferred', text: 'Unknown' })),
    el('td', {}, el('div', { class: 'ev' }, (ids || []).map(id => el('div', {}, chips([id], s), ' ', el('span', { text: ev.has(id) ? `${ev.get(id).label}: ${ev.get(id).value}` : 'not in the input' }))))));
  return [
    el('p', { class: 'lede' }, out.summary.map(x => x.text).join(' ')),
    el('div', { class: 'ledger-wrap' }, el('table', { class: 'ledger' },
      el('thead', {}, el('tr', {}, ['#', 'Statement', 'Basis', 'Evidence'].map(h => el('th', { text: h })))),
      el('tbody', {},
        out.claims.map((c, i) => row(i + 1, c.text, c.basis, c.evidence)),
        out.unknowns.map((u, i) => row('?' + (i + 1), u.text, null, u.evidence)))))
  ];
}

function aiLabel(s) {
  const from = s.hasSource ? 'on-chain data, its verified source and Canary results' : 'on-chain data and Canary results';
  return el('div', { class: 'ai-label' },
    el('strong', { text: 'Written by an AI' }),
    ` on ${s.generated} from ${from} for this strategy version (deployed in slot ${s.version.slot}). It can be wrong. It is not an audit, a safety rating or advice.`);
}

function renderTabs() {
  $('tabs').replaceChildren(...SAMPLES.map((s, i) => el('button', {
    type: 'button', role: 'tab', 'aria-selected': String(i === state.s), text: s.tab,
    onclick: () => { state.s = i; state.d = 'pass'; go(); }
  })));
}
function renderHead(s) {
  $('head').replaceChildren(
    el('h1', { text: s.title }),
    el('div', { class: 'sub' },
      el('span', {}, 'Program ', el('span', { class: 'mono', text: s.program })),
      el('span', { text: `Version: deployed in slot ${s.version.slot}` }),
      el('span', { text: s.known })));
}
function renderExplainer(s, verdict) {
  const out = output(s);
  const kids = [];
  if (s.outputs.fooled) {
    kids.push(el('div', { class: 'drafts' }, 'Model output:',
      ['pass', 'fooled'].map(d => el('button', {
        type: 'button', 'aria-pressed': String(state.d === d),
        text: d === 'pass' ? 'Draft that follows the rules' : 'Draft from a model the metadata fooled',
        onclick: () => { state.d = d; go(); }
      }))));
  }
  if (verdict.injection.shown) {
    kids.push(el('div', { class: 'notice' }, el('b', { text: 'Note from Pipescope: ' }),
      "this strategy's metadata contains text addressed to AI tools." + (verdict.pass ? ' The explanation below does not follow it.' : '')));
  }
  if (!verdict.pass) {
    kids.push(el('div', { class: 'fallback' },
      el('b', { text: 'No explanation for this version.' }),
      el('span', { text: "The AI's draft failed Pipescope's checks twice, so only the facts are shown. The checks it failed are listed below the page (prototype only)." })));
  } else {
    kids.push(aiLabel(s));
    const body = [variantA, variantB, variantC][state.v](out, s);
    kids.push(...body.filter(Boolean));
  }
  kids.push(el('div', { class: 'feedback' }, el('button', { type: 'button', text: 'This is wrong' }), el('span', { text: 'Tell us what is wrong; a person reads every report.' })));
  $('explainer').replaceChildren(...kids);
}
function renderFacts(s) {
  const all = evidenceOf(s);
  const cited = new Set(output(s).claims.concat(output(s).summary, output(s).unknowns).flatMap(x => x.evidence || []));
  const groups = GROUPS.map(([g, title]) => {
    const rows = all.filter(e => e.group === g);
    if (!rows.length) return null;
    const h = el('h3', {}, title);
    if (g === 'Canary') h.append(el('span', { class: 'tag canary', text: s.canaryNote || 'illustrative' }));
    if (g === 'Author') h.append(el('span', { class: 'tag author', text: 'written by the author, unverified' }));
    return el('div', { class: 'group' }, h, rows.map(e => el('div', { class: 'fact' + (cited.has(e.id) ? '' : ' cited-none'), 'data-id': e.id },
      el('span', { class: 'id', text: e.id }),
      el('div', {}, el('div', { class: 'lab' }, withAddresses(e.label)), el('div', { class: 'val' }, withAddresses(e.value)),
        e.raw ? el('div', { class: 'src', text: 'As received: ' + e.raw }) : null,
        e.source ? el('div', { class: 'src', text: e.source }) : null))));
  });
  $('facts').replaceChildren(
    el('h2', { text: 'Facts' }),
    el('p', { class: 'why', text: 'Built by Pipescope from the chain and its own Canary runs, never by the AI. Ids match the chips in the explanation; faded ids are not cited.' }),
    ...groups.filter(Boolean));
}
function renderChecks(s, verdict) {
  $('checks').replaceChildren(
    el('h2', {}, 'Validator', el('span', { class: 'verdict ' + (verdict.pass ? 'pass' : 'fail'), text: verdict.pass ? 'passed, shown' : 'failed, not shown' })),
    el('p', { text: 'Prototype only: the checks production code runs on the AI output before showing it. On a failure it retries once with the errors, then shows the facts alone.' }),
    el('ul', {}, verdict.checks.map(c => el('li', { class: c.ok ? 'ok' : 'no' },
      el('span', { class: 'm', text: c.ok ? '✓' : '✗' }), el('span', { text: c.name }),
      c.errors.slice(0, 4).map(e => el('span', { class: 'err', text: e }))))),
    el('p', { text: `Author text addressed to AI tools: model flag ${verdict.injection.model ? 'yes' : 'no'}, code detector ${verdict.injection.code ? 'yes' : 'no'}, so the notice is ${verdict.injection.shown ? 'shown' : 'not shown'}.` }));
}
function renderIO(s) {
  const all = evidenceOf(s);
  const input = {
    prompt_version: PROMPT_VERSION,
    strategy_version: { program: s.program, deploy_slot: s.version.slot },
    evidence: all.filter(e => e.group !== 'Author').map(({ id, label, value }) => ({ id, label, value })),
    author_text_tool_result: all.filter(e => e.group === 'Author').map(({ id, label, value }) => ({ id, origin: label, text: value }))
  };
  $('io').replaceChildren(
    el('summary', { text: 'The model input and output for this sample (JSON)' }),
    el('p', { text: 'The input is what Pipescope would send after normalising author text; author text goes in a tool result, JSON-encoded. The output is the structured JSON the model returns; the page above renders it as plain text.' }),
    el('pre', { text: JSON.stringify(input, null, 2) }),
    el('pre', { text: JSON.stringify(output(s), null, 2) }));
  $('io').open = false;
}
function renderAbout(s) {
  $('about').replaceChildren(...(s.notes || []).map(n => el('p', { text: n })));
}
function go() {
  const s = sample();
  const v = VARIANTS[state.v];
  const hash = `${s.key}-${v.key}${state.d === 'fooled' ? '-fooled' : ''}`;
  if (location.hash.slice(1) !== hash) history.replaceState(null, '', '#' + hash);
  const verdict = validate({ evidence: evidenceOf(s) }, output(s));
  renderTabs(); renderHead(s); renderExplainer(s, verdict); renderFacts(s); renderChecks(s, verdict); renderIO(s); renderAbout(s);
  $('vlabel').textContent = `${v.key.toUpperCase()} · ${v.name}`;
}
function fromHash() {
  const m = location.hash.slice(1).match(/^([a-z0-9-]+?)-([abc])(-fooled)?$/);
  if (!m) return;
  const i = SAMPLES.findIndex(x => x.key === m[1]);
  if (i >= 0) { state.s = i; state.v = 'abc'.indexOf(m[2]); state.d = m[3] && SAMPLES[i].outputs.fooled ? 'fooled' : 'pass'; }
}
function step(d) { state.v = (state.v + d + VARIANTS.length) % VARIANTS.length; go(); }
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
window.addEventListener('hashchange', () => { fromHash(); go(); });
fromHash();
go();

</script>
