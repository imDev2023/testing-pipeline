# CI's runners on the owner's iMac (docs/toolchain.md, "CI on the owner's iMac"). Two, so the
# `rust` and `kani` jobs of one run go side by side; each has its own home volume, which keeps
# its registration, the toolchains the jobs install and their caches. No host folder is
# mounted, so a job sees nothing of the Mac's files or keys.
name: testing-pipeline-ci

x-runner: &runner
  # Built here by runner-1 and shared; never pulled, since no registry holds it.
  image: testing-pipeline-ci-runner
  pull_policy: never
  restart: unless-stopped
  init: true
  # Within Docker Desktop's VM (20 CPUs, 16 GB), half each, less what the VM keeps.
  cpus: 8
  mem_limit: 7g
  environment:
    REPO_URL: https://github.com/imDev2023/testing-pipeline

services:
  runner-1:
    <<: *runner
    build: .
    volumes: [runner-1:/home/runner]
  runner-2:
    <<: *runner
    volumes: [runner-2:/home/runner]

volumes:
  runner-1:
  runner-2:
