# Quotes a live Pipeline market with pipeline-quoter and times each stage (docs/toolchain.md).
# Pipeline's crates come from its repository at a pinned commit; none of its source is copied here.
[package]
name = "quote-devnet"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
pipeline-client = { git = "https://github.com/MetalLegBob/pipeline", rev = "a2d5bfbe62ff61d3ca0ce7a976520da61a0f16c4" }
pipeline-quoter = { git = "https://github.com/MetalLegBob/pipeline", rev = "a2d5bfbe62ff61d3ca0ce7a976520da61a0f16c4" }
pipeline-strategy-interface = { git = "https://github.com/MetalLegBob/pipeline", rev = "a2d5bfbe62ff61d3ca0ce7a976520da61a0f16c4" }
serde_json = "1"
solana-account = "=4.7.0"
ureq = "3"

# Its own workspace, so it stays out of any workspace this repo grows.
[workspace]
