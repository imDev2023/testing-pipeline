[package]
name = "buy-wall-amm"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Pipeline strategy whose markets own their liquidity: a token against wrapped SOL on a constant-product curve with an inventory cap and a buy wall below the price, a port of IMD's Pool4 design"

[lib]
crate-type = ["cdylib", "lib"]
name = "buy_wall_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []
# Sets `DESIGNER_RECIPIENT` to a test key, for CI's extra test build only (`config.rs`).
test-designer-recipient = []

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
bytemuck.workspace = true
mint-rules.workspace = true
pipeline-strategy-interface.workspace = true
solana-security-txt.workspace = true

# Anchor's macros check `target_os = "solana"`, which host builds don't know about, and
# Kani sets `kani`; `kani_full` turns on the full-domain proofs, as in Pipeline.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(kani)', 'cfg(kani_full)'] }

# For the tests in `tests/` and the unit tests' properties only. `cargo build-sbf` never
# builds these.
[dev-dependencies]
borsh.workspace = true
litesvm.workspace = true
pipeline-check.workspace = true
pipeline-client.workspace = true
proptest.workspace = true
published-check.workspace = true
serde_json.workspace = true
solana-account.workspace = true
solana-keypair.workspace = true
solana-message.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
stand-in-launchpad.workspace = true
spl-token-2022-interface.workspace = true
