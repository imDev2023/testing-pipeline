# Only for `anchor idl build`, which needs an Anchor workspace to build the IDL in
# idl/containment_hook.json (scripts/build-idl.sh). Programs are built by cargo build-sbf, never by
# `anchor build` (docs/toolchain.md).
[toolchain]
anchor_version = "1.2.1"

[workspace]
members = ["."]

[programs.localnet]
containment_hook = "aueUqJKZDZmb2vX3rJEn3ZfYQpx6DTxtfSWMccXdkjv"

[provider]
cluster = "localnet"
wallet = "/dev/null"
