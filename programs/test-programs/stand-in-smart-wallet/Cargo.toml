[package]
name = "stand-in-smart-wallet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test only: a smart wallet that forwards a signed instruction by CPI, one call level above it"
publish = false

# A test program: scripts/build-programs.sh builds it into the gitignored fixtures/test-programs,
# scripts/workspace-programs.py leaves it out of the programs that are deployed, and no deploy
# script names it. It never goes to devnet.
[package.metadata.testing-pipeline]
test-program = true

[lib]
crate-type = ["cdylib", "lib"]
name = "stand_in_smart_wallet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(kani)', 'cfg(kani_full)'] }
