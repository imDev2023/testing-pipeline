# Our on-chain programs, laid out as Pipeline lays out its own `programs/` workspace.
# Licensed Apache-2.0 (LICENSE beside this file, docs/adr/0002).
#
# Build each program on its own, by its manifest:
#
#   cargo build-sbf --manifest-path tax-amm/Cargo.toml    # target/deploy/tax_amm.so
#   cargo build-sbf --manifest-path containment-hook/Cargo.toml    # target/deploy/containment_hook.so
#
# A whole-workspace build unifies dependency features across programs, which changes a
# program's bytes, so it is never how a program is built. How to build, test and run the
# local demo: docs/toolchain.md.
[workspace]
resolver = "2"
members = ["mint-rules", "tax-amm", "buy-wall-amm", "containment-hook", "lending-amm", "test-programs/stand-in-launchpad"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/imDev2023/testing-pipeline"

# Every pin the engineering and security bar asks for ("Framework and toolchain",
# "Starting point"), in one place. Move them only together with Pipeline, in a PR of its own.
[workspace.dependencies]
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"
# Pipeline's crates, pinned by commit, never by branch. scripts/fetch-pipeline.sh reads this
# rev to clone Pipeline for the TypeScript SDK and its test programs.
pipeline-strategy-interface = { git = "https://github.com/MetalLegBob/pipeline", rev = "5ad130d" }
pipeline-client = { git = "https://github.com/MetalLegBob/pipeline", rev = "5ad130d" }
pipeline-check = { git = "https://github.com/MetalLegBob/pipeline", rev = "5ad130d", default-features = false }
pipeline-events = { git = "https://github.com/MetalLegBob/pipeline", rev = "5ad130d" }
solana-security-txt = "=1.1.3"
mint-rules = { path = "mint-rules" }
# The buy wall AMM's zero-copy market state (Anchor's `zero_copy` derives through it).
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
# The containment hook reads the tax AMM's program id and market state layout from its crate.
tax-amm = { path = "tax-amm", features = ["no-entrypoint"] }
# Test only: the stand-in launchpad every strategy's seeding tests share (never deployed).
stand-in-launchpad = { path = "test-programs/stand-in-launchpad", features = ["no-entrypoint"] }
# Test-only crates, at the versions Pipeline's template uses at 5ad130d, and the versions
# LiteSVM uses for the ones the template does not.
base64 = "0.22"
borsh = { version = "1.5", features = ["derive"] }
litesvm = "=0.18.2"
serde_json = "1"
solana-account = "4.3"
solana-clock = "~3.2.0"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"
spl-tlv-account-resolution = "0.11.4"
spl-token-2022-interface = "3.1.2"
spl-transfer-hook-interface = "2.1.0"
toml = "0.9"
# Property tests of the maths (docs/spec/README.md, "Test layers" 2 and 3).
proptest = "1.7"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace.metadata.solana]
# Platform tools for cargo-build-sbf (sBPF v3), as Pipeline pins them. On the owner's Intel
# Mac, scripts/toolchain-env.sh passes v1.57 instead, which has no v1.58 build.
tools-version = "v1.58"

[workspace.metadata.cli]
# Chooses the solana-verify Docker image, as Pipeline pins it.
solana = "4.3.0"
