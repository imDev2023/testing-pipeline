[package]
name = "canary"
version = "0.4.0"
description = "Canary checks: trade a private copy of one Pipeline market as a trader would, and record what happened"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "canary"
path = "src/main.rs"

[dependencies]
pipeline-check.workspace = true
pipeline-client.workspace = true
pipeline-quoter.workspace = true
pipeline-strategy-interface.workspace = true
litesvm.workspace = true
solana-account.workspace = true
solana-clock.workspace = true
solana-epoch-schedule.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
spl-token-2022-interface.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
borsh = { version = "1.5", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
