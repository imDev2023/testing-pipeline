# Aviary's native Rust, apart from the on-chain workspace in `programs/`, so that a native
# dependency here can never change a program's bytes (docs/spec/pipescope-architecture.md,
# "Pipeline's packages"). Today it holds one crate, `canary`, the Canary checks' binary.
#
#   cd crates && cargo test        # LiteSVM through devnet's router; see canary/README.md
[workspace]
resolver = "2"
members = ["canary"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/imDev2023/testing-pipeline"

# The one place the terminal's Rust pins Pipeline (PIPESCOPE-87): its Apache-2.0 crates from
# crates.io at exact versions, the newest release (0.3.0, 2026-11-21, Pipeline's `48a6b5f`, for the
# router with fee mints, `route` and lookup tables that devnet runs; `pipeline-strategy-interface`
# 0.1.1, additive).
# A move to a newer release is a PR of its own that moves these together.
[workspace.dependencies]
pipeline-check = "=0.3.0"
pipeline-client = "=0.3.0"
pipeline-quoter = "=0.3.0"
pipeline-strategy-interface = "=0.1.1"
# The local Solana VM, at the version pipeline-quoter and pipeline-check pin.
litesvm = "=0.18.2"
# Solana types at the versions Pipeline's crates use.
solana-account = "4.7.0"
solana-clock = "~3.2.0"
solana-epoch-schedule = "3.3.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.3.0"
spl-token-2022-interface = "3.1.2"
